name: Build and Publish Docker image

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: "43 5 * * 2"   # weekly: pick up new caddy:latest base images
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (native, for smoke test)
        uses: docker/build-push-action@v6
        with:
          load: true
          pull: true
          tags: caddy-ovh:candidate

      - name: Smoke test
        run: |
          docker run --rm caddy-ovh:candidate caddy version
          docker run --rm caddy-ovh:candidate caddy list-modules | grep -q '^dns.providers.ovh$'

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/caddy-ovh:latest
